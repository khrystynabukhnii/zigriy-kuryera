    #map { height:100%; }

      position:absolute; z-index:1000; left:12px; top:12px; right:12px; max-width:420px;

      box-shadow:0 10px 40px rgba(10,10,10,.14);
    }
    .kicker { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

    .sub { font-size:13px; color:var(--muted); margin-bottom:10px; }
    input {
      width:100%; box-sizing:border-box; border:1px solid #e4e7eb; border-radius:10px;
      padding:10px 12px; font-size:15px; outline:none;
    }
    input:focus { border-color:#111; }
    .legend { display:flex; gap:14px; margin-top:10px; font-size:12px; color:#333; }
    .swatch { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle; }
    .pop b { display:block; font-size:16px; margin-bottom:2px; }
    .pop .city { color:#667; font-size:13px; }
    .pop .offer { margin-top:8px; font-weight:800; color:#b45309; font-size:15px; }
    .pin {
      width:18px; height:18px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
      border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35);
    }
    .leaflet-popup-content-wrapper { border-radius:12px; }
